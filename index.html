<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos Protocol</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- スマホ用のキーボード起動用input -->
<input type="text" id="mobile-typing-input" style="position: absolute; opacity: 0; pointer-events: none;" autocomplete="off">

<div id="console-container">
  <!-- タイトル画面 -->
  <div id="title-screen">
    <h1 id="game-title">CHRONOS PROTOCOL</h1>
    <p id="game-subtitle">-- 宙域観測船クロノス・極秘任務記録 --</p>
    <!-- タイトル画面のボタン部分 -->
    <button id="start-btn-1" style="margin-bottom: 10px;">第1章：深淵からの呼び声</button>
    <button id="start-btn-2" style="margin-bottom: 10px;">第2章：招かれざる乗客たち</button>
    <button id="start-btn-3">第3章：クロノス・プロトコル</button>
  </div>

  <!-- ゲームプレイ画面（最初は非表示） -->
  <div id="game-screen" style="display: none;">
    <div id="status-bar">
      <span id="ship-status">CHRONOS M-SYS // STATUS: NOMINAL</span>
      <span id="sync-rate">SYNC: 0.00%</span>      
    </div>

    <div id="main-monitor">
      <div id="entity-core"></div>
    </div>
    
    <div id="bottom-panel">
      <div id="log-window"></div>
      <div id="interactive-panel">
        <div id="choice-container"></div>
        
        <!-- ▼▼▼ 第2章のタイピング用エリア ▼▼▼ -->
        <div id="typing-container" style="display: none; text-align: center; margin-top: 10px;">
          <div id="typing-target" style="font-family: 'Courier New', monospace; font-size: 1.5rem; color: #0f0; letter-spacing: 5px;"></div>
          <div id="typing-input" style="font-family: 'Courier New', monospace; font-size: 1.5rem; color: #fff; letter-spacing: 5px;"></div>
        </div>
        <!-- ▲▲▲ ここまで ▲▲▲ -->

        <button id="sync-btn">TX: 同期パルス送信</button>
      </div>
    </div>
  </div>

  <!-- ▼▼▼ エンディング画面 ▼▼▼ -->
  <div id="ending-screen" style="display: none; flex-direction: column; justify-content: center; align-items: center; height: 100%; width: 100%; position: absolute; top: 0; left: 0; background-color: #000; z-index: 10; color: #0f0; font-family: 'Courier New', Courier, monospace; text-align: center;">
    <div id="epilogue-text" style="font-size: 1.2rem; margin-bottom: 40px; opacity: 0; transition: opacity 2s; line-height: 1.8; padding: 20px;"></div>
    
    <div id="credits-container" style="overflow: hidden; height: 250px; width: 100%; position: relative; margin-bottom: 20px;">
      <div id="credits-content" style="position: absolute; width: 100%; top: 250px; text-align: center;">
        <h2 style="color: #0ff; margin-bottom: 30px;">CHRONOS PROTOCOL</h2>
        
        <p style="margin-bottom: 5px;">DIRECTOR / PROGRAMMER</p>
        <p style="margin-bottom: 30px;">M.O.M.O.</p>
        
        <p style="margin-bottom: 5px;">UI DESIGN / SCENARIO</p>
        <p style="margin-bottom: 30px;">M.O.M.O.</p>
        
        <p style="margin-bottom: 5px;">SPECIAL THANKS</p>
        <p style="margin-bottom: 40px;">ZEN University</p>
        
        <h3 style="color: #fff;">THANK YOU FOR PLAYING</h3>
      </div>
    </div>
    
    <button id="return-title-btn" style="display: none; padding: 10px 20px; background-color: transparent; color: #0f0; border: 1px solid #0f0; cursor: pointer; margin-top: 20px;">タイトルへ戻る</button>
  </div>
  <!-- ▲▲▲ ここまで ▲▲▲ -->

</div>

<script src="script1.js"></script>
<script src="script2.js"></script>
<script src="script3.js"></script>
</body>
</html>
